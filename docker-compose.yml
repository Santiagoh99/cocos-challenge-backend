services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cocos
      POSTGRES_USER: cocos
      POSTGRES_PASSWORD: cocos
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cocos -d cocos']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
